    <text x="118" y="306" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#1F1633">Gap diagnosed</text>
    <text font-size="18" font-family="Arial, Microsoft YaHei, sans-serif" fill="#4B405D" x="118" y="360">The main gap is in decode,</text><text font-size="18" font-family="Arial, Microsoft YaHei, sans-serif" fill="#4B405D" x="118" y="390">and it grows with context.</text><path fill="#FFFFFF" stroke="#D6CBE8" d="M476,190 H802 A8,8 0 0 1 810,198 V448 A8,8 0 0 1 802,456 H476 A8,8 0 0 1 468,448 V198 A8,8 0 0 1 476,190 Z" />
    
  <g transform="translate(504.0, 228.0) scale(1.5)" fill="none" stroke="#9E89C2" stroke-width="2">
    <path d="M3 12h4l3 8l4 -16l3 8h4" />
  </g>
    <text x="504" y="306" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#1F1633">Cost explained</text>
    <text font-size="18" font-family="Arial, Microsoft YaHei, sans-serif" fill="#4B405D" x="504" y="360">The profile points to repeated</text><text font-size="18" font-family="Arial, Microsoft YaHei, sans-serif" fill="#4B405D" x="504" y="390">model work, not Python loop cost.</text><path fill="#FFFFFF" stroke="#D6CBE8" d="M862,190 H1188 A8,8 0 0 1 1196,198 V448 A8,8 0 0 1 1188,456 H862 A8,8 0 0 1 854,448 V198 A8,8 0 0 1 862,190 Z" />
    
  <g transform="translate(890.0, 228.0) scale(1.5)" fill="none" stroke="#6B4CA3" stroke-width="2">
