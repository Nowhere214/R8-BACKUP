    <path d="M9 12l2 2l4 -4" />
  </g>
    <text x="890" y="306" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#1F1633">Baseline credible</text>
    <text font-size="18" font-family="Arial, Microsoft YaHei, sans-serif" fill="#4B405D" x="890" y="360">Self Stage 1 matches the</text><text font-size="18" font-family="Arial, Microsoft YaHei, sans-serif" fill="#4B405D" x="890" y="390">reference baseline.</text></g>
