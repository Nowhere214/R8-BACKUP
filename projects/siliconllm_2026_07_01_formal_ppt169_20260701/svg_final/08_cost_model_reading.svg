  <g transform="translate(884.0, 252.0) scale(1.4166666666666667)" fill="none" stroke="#9E89C2" stroke-width="2">
    <path d="M3 12h4l3 8l4 -16l3 8h4" />
  </g>
    <text x="932" y="275" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#1F1633">Interpretation</text>
    <path d="M884 314 H1180" stroke="#D6CBE8" stroke-width="1" />
    <text font-size="18" font-family="Arial, Microsoft YaHei, sans-serif" fill="#1F1633" x="884" y="366">Stage 1 repeats more work as</text><text font-size="18" font-family="Arial, Microsoft YaHei, sans-serif" fill="#1F1633" x="884" y="396">the context gets longer.</text><text font-size="18" font-family="Arial, Microsoft YaHei, sans-serif" fill="#1F1633" x="884" y="440">mlx-lm is nearly flat in this</text><text font-size="18" font-family="Arial, Microsoft YaHei, sans-serif" fill="#1F1633" x="884" y="470">same reading.</text><path fill="#F4EBDD" d="M890,464 H1174 A6,6 0 0 1 1180,470 V504 A6,6 0 0 1 1174,510 H890 A6,6 0 0 1 884,504 V470 A6,6 0 0 1 890,464 Z" />
    <text x="904" y="493" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#7A4B00">Prompt-1024 projections are not measured.</text>
  </g>
  <g id="footer">
    <text x="64" y="675" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#6F6280">Source: decode cost model summary; values are slope estimates from local benchmark logs</text>
    <text x="1190" y="675" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#6F6280">08 / 16</text>
