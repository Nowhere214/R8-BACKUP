<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F4EFFA" />
  <g id="header">
    <text x="64" y="62" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#6B4CA3" font-weight="700">COST MODEL READING</text>
    <text x="64" y="102" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#1F1633">Stage 1 pays a measurable cost per context token</text>
    <path fill="#EDE7F6" d="M72,126 H1208 A8,8 0 0 1 1216,134 V182 A8,8 0 0 1 1208,190 H72 A8,8 0 0 1 64,182 V134 A8,8 0 0 1 72,126 Z" />
    <text font-size="19" font-family="Arial, Microsoft YaHei, sans-serif" fill="#3E1485" x="88" y="151">The slope is the important signal: full-context decode makes each new token</text><text font-size="19" font-family="Arial, Microsoft YaHei, sans-serif" fill="#3E1485" x="88" y="176">depend on the previous prompt length.</text></g>
  <g id="purple-titlebar">
