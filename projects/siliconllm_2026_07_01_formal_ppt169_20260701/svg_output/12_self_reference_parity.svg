    <text x="946" y="540" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" font-weight="700" fill="#7A4B00">Claim boundary</text>
    <text x="946" y="562" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#1F1633">This validates parity, not speedup.</text>
