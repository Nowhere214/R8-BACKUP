    <text x="974" y="213" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" font-weight="700" fill="#1F1633">Key reading</text>
    <path d="M926 252 H1180" stroke="#D6CBE8" stroke-width="1"/>
    <text x="926" y="313" font-family='Arial, Microsoft YaHei, sans-serif' font-size="46" font-weight="700" fill="#6B4CA3">1.004x</text>
