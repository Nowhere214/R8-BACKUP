    <rect x="1190" y="0" width="90" height="118" fill="#9E89C2"/>
    <text x="64" y="43" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700">SELF BASELINE VALIDATION</text>
    <text x="64" y="84" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Self Stage 1 matches the reference baseline</text>
    <text x="1235" y="70" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">12</text>
  </g>
  <g id="figure">
    <rect x="66" y="154" width="790" height="470" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <image href="../images/formal_fig05_self_reference_parity.png" x="92" y="182" width="738" height="414" preserveAspectRatio="xMidYMid meet"/>
