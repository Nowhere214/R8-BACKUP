<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F4EFFA"/>
  <g id="header">
    <text x="64" y="62" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#6B4CA3" font-weight="700">WHY BASELINE FIRST</text>
    <text x="64" y="102" font-family='Arial, Microsoft YaHei, sans-serif' font-size="34" font-weight="700" fill="#1F1633">Optimization claims need a faithful baseline</text>
    <rect x="64" y="126" width="1152" height="64" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <text x="88" y="151" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" fill="#3E1485">
      <tspan x="88" dy="0">Before claiming speedup, I need a baseline that passes tests</tspan>
      <tspan x="88" dy="25">and matches the reference implementation.</tspan>
    </text>
  </g>
  <g id="purple-titlebar">
    <rect x="0" y="0" width="1190" height="118" fill="#3E1485"/>
    <rect x="1190" y="0" width="90" height="118" fill="#9E89C2"/>
    <text x="64" y="43" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700">WHY BASELINE FIRST</text>
    <text x="64" y="84" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Optimization claims need a faithful baseline</text>
    <text x="1235" y="70" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">10</text>
  </g>
  <g id="process">
    <rect x="82" y="246" width="240" height="230" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <use data-icon="tabler-outline/chart-line" x="112" y="282" width="36" height="36" fill="#3E1485" stroke-width="2"/>
    <text x="112" y="354" font-family='Arial, Microsoft YaHei, sans-serif' font-size="22" font-weight="700" fill="#1F1633">1. Diagnose</text>
    <text x="112" y="400" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#4B405D">
      <tspan x="112" dy="0">Find where decode</tspan>
      <tspan x="112" dy="28">spends time.</tspan>
    </text>
    <use data-icon="tabler-outline/arrow-right" x="344" y="342" width="40" height="40" fill="#6F6280" stroke-width="2"/>
    <rect x="406" y="246" width="240" height="230" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <use data-icon="tabler-outline/code" x="436" y="282" width="36" height="36" fill="#6B4CA3" stroke-width="2"/>
    <text x="436" y="354" font-family='Arial, Microsoft YaHei, sans-serif' font-size="22" font-weight="700" fill="#1F1633">2. Implement</text>
    <text x="436" y="400" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#4B405D">
      <tspan x="436" dy="0">Build the tutorial</tspan>
      <tspan x="436" dy="28">Stage 1 path.</tspan>
    </text>
    <use data-icon="tabler-outline/arrow-right" x="668" y="342" width="40" height="40" fill="#6F6280" stroke-width="2"/>
    <rect x="730" y="246" width="240" height="230" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <use data-icon="tabler-outline/circle-check" x="760" y="282" width="36" height="36" fill="#6B4CA3" stroke-width="2"/>
    <text x="760" y="354" font-family='Arial, Microsoft YaHei, sans-serif' font-size="22" font-weight="700" fill="#1F1633">3. Validate</text>
    <text x="760" y="400" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#4B405D">
      <tspan x="760" dy="0">Check tests and</tspan>
      <tspan x="760" dy="28">self/reference parity.</tspan>
    </text>
    <use data-icon="tabler-outline/arrow-right" x="992" y="342" width="40" height="40" fill="#6F6280" stroke-width="2"/>
    <rect x="1054" y="246" width="160" height="230" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <use data-icon="tabler-outline/route" x="1084" y="282" width="36" height="36" fill="#9E89C2" stroke-width="2"/>
    <text x="1084" y="354" font-family='Arial, Microsoft YaHei, sans-serif' font-size="22" font-weight="700" fill="#1F1633">4. Optimize</text>
    <text x="1084" y="400" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#4B405D">
      <tspan x="1084" dy="0">Change one</tspan>
      <tspan x="1084" dy="28">lever.</tspan>
    </text>
  </g>
  <g id="takeaway">
    <rect x="230" y="546" width="820" height="58" rx="8" fill="#E8E1F1"/>
    <text x="264" y="572" font-family='Arial, Microsoft YaHei, sans-serif' font-size="21" font-weight="700" fill="#6B4CA3">
      <tspan x="264" dy="0">This protects the research from comparing an optimized engine</tspan>
      <tspan x="264" dy="28">to an untrusted implementation.</tspan>
    </text>
  </g>
  <g id="footer">
    <text x="64" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#6F6280">Source: Phase 1 implementation plan and self-baseline benchmark notes</text>
    <text x="1190" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#6F6280">10 / 16</text>
  </g>
</svg>
