<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <g id="header">
    <text x="64" y="62" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#0F766E" font-weight="700">THREE-ENGINE BASELINE</text>
    <text x="64" y="102" font-family='Arial, Microsoft YaHei, sans-serif' font-size="34" font-weight="700" fill="#0F172A">A third engine confirms the decode story</text>
    <rect x="64" y="126" width="1152" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="88" y="151" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" fill="#1E3A5F">
      <tspan x="88" dy="0">llama.cpp sits between the tutorial baseline and mlx-lm.</tspan>
      <tspan x="88" dy="25">This supports the bottleneck diagnosis without relying on one framework.</tspan>
    </text>
  </g>
  <g id="figure">
    <rect x="66" y="210" width="790" height="410" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <image href="../images/formal_fig02_three_engine_decode.png" x="90" y="232" width="742" height="358" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="reading">
    <rect x="894" y="210" width="322" height="410" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <use data-icon="tabler-outline/cpu" x="926" y="244" width="34" height="34" fill="#1E3A5F" stroke-width="2"/>
    <text x="974" y="267" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" font-weight="700" fill="#0F172A">How to read it</text>
    <path d="M926 306 H1180" stroke="#CBD5E1" stroke-width="1"/>
    <text x="926" y="354" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#0F172A">
      <tspan x="926" dy="0">Stage 1 remains the slow</tspan>
      <tspan x="926" dy="28">faithful baseline.</tspan>
      <tspan x="926" dy="44">mlx-lm is the optimized</tspan>
      <tspan x="926" dy="28">Apple-Silicon reference.</tspan>
      <tspan x="926" dy="44">llama.cpp adds an external</tspan>
      <tspan x="926" dy="28">systems point for comparison.</tspan>
    </text>
    <rect x="926" y="536" width="254" height="46" rx="6" fill="#FEF3C7"/>
    <text x="946" y="565" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" font-weight="700" fill="#B45309">Boundary: 7B remains a stress case</text>
  </g>
  <g id="footer">
    <text x="64" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#64748B">Source: llama.cpp Metal benchmark summary and Phase 0 unified baseline table</text>
    <text x="1190" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#64748B">05 / 16</text>
  </g>
</svg>
