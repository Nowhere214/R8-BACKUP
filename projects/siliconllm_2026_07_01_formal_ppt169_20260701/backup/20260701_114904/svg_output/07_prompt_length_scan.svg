<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <g id="header">
    <text x="64" y="62" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#0F766E" font-weight="700">PROMPT-LENGTH SCAN</text>
    <text x="64" y="102" font-family='Arial, Microsoft YaHei, sans-serif' font-size="34" font-weight="700" fill="#0F172A">The decode gap increases as context grows</text>
  </g>
  <g id="figure">
    <rect x="66" y="154" width="790" height="470" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <image href="../images/formal_fig03_prompt_length_gap.png" x="92" y="184" width="738" height="410" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="insights">
    <rect x="894" y="154" width="322" height="470" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <use data-icon="tabler-outline/chart-line" x="926" y="190" width="34" height="34" fill="#0F766E" stroke-width="2"/>
    <text x="974" y="213" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" font-weight="700" fill="#0F172A">Reading</text>
    <path d="M926 252 H1180" stroke="#CBD5E1" stroke-width="1"/>
    <text x="926" y="305" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#0F172A">
      <tspan x="926" dy="0">The curve is not flat.</tspan>
      <tspan x="926" dy="30">Longer prompts expose more</tspan>
      <tspan x="926" dy="30">full-context computation.</tspan>
      <tspan x="926" dy="46">This is why KV-cache is the</tspan>
      <tspan x="926" dy="30">right next optimization target.</tspan>
    </text>
    <rect x="926" y="484" width="254" height="78" rx="6" fill="#D1FAE5"/>
    <text x="946" y="516" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#0F766E" font-weight="700">Implication</text>
    <text x="946" y="544" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#0F172A">Optimize decode memory reuse first.</text>
  </g>
  <g id="footer">
    <text x="64" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#64748B">Source: workload-length scan summaries for Qwen2 0.5B and 1.5B</text>
    <text x="1190" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#64748B">07 / 16</text>
  </g>
</svg>
