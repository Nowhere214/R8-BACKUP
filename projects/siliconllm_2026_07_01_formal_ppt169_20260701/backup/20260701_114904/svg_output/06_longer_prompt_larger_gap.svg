<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <g id="header">
    <text x="64" y="64" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#0F766E" font-weight="700">WORKLOAD EFFECT</text>
    <text x="64" y="108" font-family='Arial, Microsoft YaHei, sans-serif' font-size="44" font-weight="700" fill="#0F172A">Longer prompt, larger decode gap</text>
  </g>
  <g id="hero">
    <rect x="82" y="182" width="342" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="118" y="236" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#64748B">short context</text>
    <text x="118" y="304" font-family='Arial, Microsoft YaHei, sans-serif' font-size="46" font-weight="700" fill="#1E3A5F">14-15x</text>
    <text x="118" y="350" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" fill="#475569">Stage 1 vs mlx-lm</text>
    <rect x="118" y="382" width="180" height="8" rx="4" fill="#DBEAFE"/>
    <rect x="118" y="382" width="72" height="8" rx="4" fill="#1E3A5F"/>
    <rect x="468" y="182" width="342" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="504" y="236" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#64748B">prompt scan trend</text>
    <text x="504" y="304" font-family='Arial, Microsoft YaHei, sans-serif' font-size="46" font-weight="700" fill="#0F766E">monotonic</text>
    <text x="504" y="350" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" fill="#475569">gap grows with context</text>
    <path d="M510 386 C555 356 590 410 636 374 C680 340 713 354 762 318" fill="none" stroke="#0F766E" stroke-width="5"/>
    <rect x="854" y="182" width="342" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="890" y="236" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#64748B">long context</text>
    <text x="890" y="304" font-family='Arial, Microsoft YaHei, sans-serif' font-size="46" font-weight="700" fill="#D97706">58x</text>
    <text x="890" y="350" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" fill="#475569">observed at longer prompt</text>
    <rect x="890" y="382" width="180" height="8" rx="4" fill="#FEF3C7"/>
    <rect x="890" y="382" width="162" height="8" rx="4" fill="#D97706"/>
  </g>
  <g id="interpretation">
    <rect x="176" y="502" width="928" height="76" rx="8" fill="#DBEAFE"/>
    <use data-icon="tabler-outline/chart-line" x="210" y="524" width="32" height="32" fill="#1E3A5F" stroke-width="2"/>
    <text x="262" y="542" font-family='Arial, Microsoft YaHei, sans-serif' font-size="21" font-weight="700" fill="#1E3A5F">
      <tspan x="262" dy="0">The gap is tied to full-context decode work,</tspan>
      <tspan x="262" dy="28">not only to fixed overhead.</tspan>
    </text>
  </g>
  <g id="footer">
    <text x="64" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#64748B">Source: workload prompt-length scan summaries; diagnostic evidence, not final speedup claim</text>
    <text x="1190" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#64748B">06 / 16</text>
  </g>
</svg>
