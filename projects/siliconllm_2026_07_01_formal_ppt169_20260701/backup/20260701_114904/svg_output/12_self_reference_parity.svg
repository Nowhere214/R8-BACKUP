<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <g id="header">
    <text x="64" y="62" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#0F766E" font-weight="700">SELF BASELINE VALIDATION</text>
    <text x="64" y="102" font-family='Arial, Microsoft YaHei, sans-serif' font-size="34" font-weight="700" fill="#0F172A">Self Stage 1 matches the reference baseline</text>
  </g>
  <g id="figure">
    <rect x="66" y="154" width="790" height="470" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <image href="../images/formal_fig05_self_reference_parity.png" x="92" y="182" width="738" height="414" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="summary">
    <rect x="894" y="154" width="322" height="470" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <use data-icon="tabler-outline/circle-check" x="926" y="190" width="34" height="34" fill="#15803D" stroke-width="2"/>
    <text x="974" y="213" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" font-weight="700" fill="#0F172A">Key reading</text>
    <path d="M926 252 H1180" stroke="#CBD5E1" stroke-width="1"/>
    <text x="926" y="313" font-family='Arial, Microsoft YaHei, sans-serif' font-size="46" font-weight="700" fill="#0F766E">1.004x</text>
    <text x="926" y="344" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#475569">0.5B decode throughput ratio</text>
    <text x="926" y="418" font-family='Arial, Microsoft YaHei, sans-serif' font-size="46" font-weight="700" fill="#1E3A5F">1.001x</text>
    <text x="926" y="449" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#475569">1.5B narrow smoke ratio</text>
    <rect x="926" y="514" width="254" height="58" rx="6" fill="#FEF3C7"/>
    <text x="946" y="540" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" font-weight="700" fill="#B45309">Claim boundary</text>
    <text x="946" y="562" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#0F172A">This validates parity, not speedup.</text>
  </g>
  <g id="footer">
    <text x="64" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#64748B">Source: Stage 1 self-baseline comparison summaries for Qwen2 0.5B and 1.5B smoke subset</text>
    <text x="1190" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#64748B">12 / 16</text>
