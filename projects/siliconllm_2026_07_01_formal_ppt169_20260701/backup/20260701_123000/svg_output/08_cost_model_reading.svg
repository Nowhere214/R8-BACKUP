<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F4EFFA"/>
  <g id="header">
    <text x="64" y="62" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#6B4CA3" font-weight="700">COST MODEL READING</text>
    <text x="64" y="102" font-family='Arial, Microsoft YaHei, sans-serif' font-size="34" font-weight="700" fill="#1F1633">Stage 1 pays a measurable cost per context token</text>
    <rect x="64" y="126" width="1152" height="64" rx="8" fill="#EDE7F6"/>
    <text x="88" y="151" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" fill="#3E1485">
      <tspan x="88" dy="0">The slope is the important signal: full-context decode makes each new token</tspan>
      <tspan x="88" dy="25">depend on the previous prompt length.</tspan>
    </text>
  </g>
  <g id="purple-titlebar">
    <rect x="0" y="0" width="1206" height="118" fill="#3E1485"/>
    <rect x="1206" y="0" width="74" height="118" fill="#9E89C2"/>
    <text x="64" y="43" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700">COST MODEL READING</text>
    <text x="64" y="84" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Stage 1 pays cost per context token</text>
    <text x="1235" y="70" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">8</text>
  </g>
  <g id="table">
    <rect x="82" y="216" width="720" height="320" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <rect x="82" y="216" width="720" height="58" rx="8" fill="#E6DEEF"/>
    <text x="114" y="252" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" font-weight="700" fill="#1F1633">model</text>
    <text x="334" y="252" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" font-weight="700" fill="#1F1633">engine</text>
    <text x="522" y="252" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" font-weight="700" fill="#1F1633">slope ms / ctx token</text>
    <path d="M82 274 H802" stroke="#D6CBE8" stroke-width="1"/>
    <path d="M302 216 V536" stroke="#D6CBE8" stroke-width="1"/>
    <path d="M490 216 V536" stroke="#D6CBE8" stroke-width="1"/>
    <text x="114" y="324" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#1F1633">Qwen2 0.5B</text>
    <text x="334" y="324" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#3E1485">Stage 1</text>
    <text x="522" y="324" font-family='Consolas, Courier New, monospace' font-size="20" font-weight="700" fill="#9E89C2">0.3268</text>
    <path d="M82 350 H802" stroke="#D6CBE8" stroke-width="1"/>
    <text x="114" y="400" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#1F1633">Qwen2 0.5B</text>
    <text x="334" y="400" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#6B4CA3">mlx-lm</text>
    <text x="522" y="400" font-family='Consolas, Courier New, monospace' font-size="20" font-weight="700" fill="#6B4CA3">0.0003</text>
    <path d="M82 426 H802" stroke="#D6CBE8" stroke-width="1"/>
    <text x="114" y="476" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#1F1633">Qwen2 1.5B</text>
    <text x="334" y="476" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#3E1485">Stage 1</text>
    <text x="522" y="476" font-family='Consolas, Courier New, monospace' font-size="20" font-weight="700" fill="#9E89C2">0.9773</text>
    <path d="M82 502 H802" stroke="#D6CBE8" stroke-width="1"/>
    <text x="114" y="528" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#1F1633">Qwen2 1.5B</text>
    <text x="334" y="528" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#6B4CA3">mlx-lm</text>
    <text x="522" y="528" font-family='Consolas, Courier New, monospace' font-size="20" font-weight="700" fill="#6B4CA3">0.0002</text>
  </g>
  <g id="interpretation">
    <rect x="850" y="216" width="366" height="320" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <use data-icon="tabler-outline/activity" x="884" y="252" width="34" height="34" fill="#9E89C2" stroke-width="2"/>
    <text x="932" y="275" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" font-weight="700" fill="#1F1633">Interpretation</text>
    <path d="M884 314 H1180" stroke="#D6CBE8" stroke-width="1"/>
    <text x="884" y="366" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#1F1633">
      <tspan x="884" dy="0">Stage 1 repeats more work as</tspan>
      <tspan x="884" dy="30">the context gets longer.</tspan>
      <tspan x="884" dy="44">mlx-lm is nearly flat in this</tspan>
      <tspan x="884" dy="30">same reading.</tspan>
    </text>
    <rect x="884" y="464" width="296" height="46" rx="6" fill="#F4EBDD"/>
    <text x="904" y="493" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" font-weight="700" fill="#7A4B00">Prompt-1024 projections are not measured.</text>
  </g>
  <g id="footer">
    <text x="64" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#6F6280">Source: decode cost model summary; values are slope estimates from local benchmark logs</text>
    <text x="1190" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#6F6280">08 / 16</text>
  </g>
</svg>
