<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F4EFFA"/>
  <g id="header">
    <text x="64" y="62" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#6B4CA3" font-weight="700">THREE-ENGINE BASELINE</text>
    <text x="64" y="102" font-family='Arial, Microsoft YaHei, sans-serif' font-size="34" font-weight="700" fill="#1F1633">A third engine confirms the decode story</text>
    <rect x="64" y="126" width="1152" height="64" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <text x="88" y="151" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" fill="#3E1485">
      <tspan x="88" dy="0">llama.cpp sits between the tutorial baseline and mlx-lm.</tspan>
      <tspan x="88" dy="25">This supports the bottleneck diagnosis without relying on one framework.</tspan>
    </text>
  </g>
  <g id="purple-titlebar">
    <rect x="0" y="0" width="1206" height="118" fill="#3E1485"/>
    <rect x="1206" y="0" width="74" height="118" fill="#9E89C2"/>
    <text x="64" y="43" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700">THREE-ENGINE BASELINE</text>
    <text x="64" y="84" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">A third engine confirms the decode story</text>
    <text x="1235" y="70" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">5</text>
  </g>
  <g id="figure">
    <rect x="66" y="210" width="790" height="410" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <image href="../images/formal_fig02_three_engine_decode.png" x="90" y="232" width="742" height="358" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="reading">
    <rect x="894" y="210" width="322" height="410" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <use data-icon="tabler-outline/cpu" x="926" y="244" width="34" height="34" fill="#3E1485" stroke-width="2"/>
    <text x="974" y="267" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" font-weight="700" fill="#1F1633">How to read it</text>
    <path d="M926 306 H1180" stroke="#D6CBE8" stroke-width="1"/>
    <text x="926" y="354" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#1F1633">
      <tspan x="926" dy="0">Stage 1 remains the slow</tspan>
      <tspan x="926" dy="28">faithful baseline.</tspan>
      <tspan x="926" dy="44">mlx-lm is the optimized</tspan>
      <tspan x="926" dy="28">Apple-Silicon reference.</tspan>
      <tspan x="926" dy="44">llama.cpp adds an external</tspan>
      <tspan x="926" dy="28">systems point for comparison.</tspan>
    </text>
    <rect x="926" y="536" width="254" height="46" rx="6" fill="#F4EBDD"/>
    <text x="946" y="565" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" font-weight="700" fill="#7A4B00">Boundary: 7B remains a stress case</text>
  </g>
  <g id="footer">
    <text x="64" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#6F6280">Source: llama.cpp Metal benchmark summary and Phase 0 unified baseline table</text>
    <text x="1190" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#6F6280">05 / 16</text>
  </g>
</svg>
