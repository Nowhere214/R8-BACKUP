    <text x="112" y="365" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#4B405D">
      <tspan x="112" dy="0">Stage 1 reference</tspan>
      <tspan x="112" dy="28">mlx-lm</tspan>
      <tspan x="112" dy="28">llama.cpp Metal</tspan>
    </text>
