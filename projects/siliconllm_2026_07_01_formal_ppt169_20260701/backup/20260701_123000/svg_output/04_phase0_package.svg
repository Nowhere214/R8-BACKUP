<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F4EFFA"/>
  <g id="header">
    <text x="64" y="62" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#6B4CA3" font-weight="700">PHASE 0 PACKAGE</text>
    <text x="64" y="102" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#1F1633">Phase 0 is now a reproducible evidence package, not one plot</text>
    <rect x="64" y="126" width="1152" height="50" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <text x="88" y="157" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#3E1485">The package separates baselines, workload effects, mechanism evidence, and caveats.</text>
  </g>
  <g id="purple-titlebar">
    <rect x="0" y="0" width="1206" height="118" fill="#3E1485"/>
    <rect x="1206" y="0" width="74" height="118" fill="#9E89C2"/>
    <text x="64" y="43" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700">PHASE 0 PACKAGE</text>
    <text x="64" y="84" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Phase 0 is now a reproducible evidence package</text>
    <text x="1235" y="70" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">4</text>
  </g>
  <g id="cards">
    <rect x="82" y="218" width="250" height="260" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
