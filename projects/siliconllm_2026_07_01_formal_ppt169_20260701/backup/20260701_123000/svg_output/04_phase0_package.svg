    <text x="404" y="318" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1F1633">Workloads</text>
    <text x="404" y="365" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#4B405D">
