    <rect x="666" y="218" width="250" height="260" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <use data-icon="tabler-outline/activity" x="696" y="252" width="34" height="34" fill="#9E89C2" stroke-width="2"/>
