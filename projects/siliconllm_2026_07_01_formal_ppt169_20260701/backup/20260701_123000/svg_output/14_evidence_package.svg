<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F4EFFA"/>
  <g id="header">
    <text x="64" y="62" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#6B4CA3" font-weight="700">EVIDENCE PACKAGE</text>
    <text x="64" y="102" font-family='Arial, Microsoft YaHei, sans-serif' font-size="34" font-weight="700" fill="#1F1633">The current state is auditable through one research table</text>
  </g>
  <g id="purple-titlebar">
    <rect x="0" y="0" width="1206" height="118" fill="#3E1485"/>
    <rect x="1206" y="0" width="74" height="118" fill="#9E89C2"/>
    <text x="64" y="43" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700">EVIDENCE PACKAGE</text>
    <text x="64" y="84" font-family="Arial, Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Current state is auditable</text>
    <text x="1235" y="70" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">14</text>
  </g>
  <g id="figure">
    <rect x="66" y="154" width="790" height="470" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <image href="../images/formal_fig06_reproducibility_summary.png" x="92" y="204" width="738" height="330" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="reading">
    <rect x="894" y="154" width="322" height="470" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <use data-icon="tabler-outline/database" x="926" y="190" width="34" height="34" fill="#3E1485" stroke-width="2"/>
    <text x="974" y="213" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" font-weight="700" fill="#1F1633">Current ledger</text>
    <path d="M926 252 H1180" stroke="#D6CBE8" stroke-width="1"/>
    <text x="926" y="314" font-family='Arial, Microsoft YaHei, sans-serif' font-size="46" font-weight="700" fill="#3E1485">151</text>
    <text x="1030" y="312" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#4B405D">Phase 0 rows</text>
    <text x="926" y="386" font-family='Arial, Microsoft YaHei, sans-serif' font-size="46" font-weight="700" fill="#6B4CA3">24</text>
    <text x="1010" y="384" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#4B405D">Phase 1 rows</text>
    <text x="926" y="458" font-family='Arial, Microsoft YaHei, sans-serif' font-size="46" font-weight="700" fill="#9E89C2">175</text>
    <text x="1030" y="456" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#4B405D">total rows</text>
    <rect x="926" y="526" width="254" height="46" rx="6" fill="#EDE7F6"/>
    <text x="946" y="555" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" font-weight="700" fill="#3E1485">Enough evidence for a formal update.</text>
