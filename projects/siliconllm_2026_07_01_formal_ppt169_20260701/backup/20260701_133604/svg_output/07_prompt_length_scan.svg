<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F4EFFA"/>
  <g id="header">
    <text x="64" y="62" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#6B4CA3" font-weight="700">PROMPT-LENGTH SCAN</text>
    <text x="64" y="102" font-family='Arial, Microsoft YaHei, sans-serif' font-size="34" font-weight="700" fill="#1F1633">The decode gap increases as context grows</text>
  </g>
  <g id="purple-titlebar">
    <rect x="0" y="0" width="1190" height="118" fill="#3E1485"/>
    <rect x="1190" y="0" width="90" height="118" fill="#9E89C2"/>
    <text x="64" y="43" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700">PROMPT-LENGTH SCAN</text>
    <text x="64" y="84" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">The decode gap increases as context grows</text>
    <text x="1235" y="70" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">7</text>
  </g>
  <g id="figure">
    <rect x="66" y="154" width="790" height="470" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <image href="../images/formal_fig03_prompt_length_gap.png" x="92" y="184" width="738" height="410" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="insights">
    <rect x="894" y="154" width="322" height="470" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <use data-icon="tabler-outline/chart-line" x="926" y="190" width="34" height="34" fill="#6B4CA3" stroke-width="2"/>
    <text x="974" y="213" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" font-weight="700" fill="#1F1633">Reading</text>
    <path d="M926 252 H1180" stroke="#D6CBE8" stroke-width="1"/>
    <text x="926" y="305" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#1F1633">
      <tspan x="926" dy="0">The curve is not flat.</tspan>
      <tspan x="926" dy="30">Longer prompts expose more</tspan>
      <tspan x="926" dy="30">full-context computation.</tspan>
      <tspan x="926" dy="46">This is why KV-cache is the</tspan>
      <tspan x="926" dy="30">right next optimization target.</tspan>
    </text>
    <rect x="926" y="484" width="254" height="78" rx="6" fill="#E8E1F1"/>
    <text x="946" y="516" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#6B4CA3" font-weight="700">Implication</text>
    <text x="946" y="544" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#1F1633">Optimize decode memory reuse first.</text>
  </g>
  <g id="footer">
    <text x="64" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#6F6280">Source: workload-length scan summaries for Qwen2 0.5B and 1.5B</text>
    <text x="1190" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#6F6280">07 / 16</text>
  </g>
</svg>
