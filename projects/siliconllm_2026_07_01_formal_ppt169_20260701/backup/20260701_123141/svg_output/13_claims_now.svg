<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F4EFFA"/>
  <g id="header">
    <text x="64" y="64" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" fill="#6B4CA3" font-weight="700">CURRENT CLAIMS</text>
    <text x="64" y="108" font-family='Arial, Microsoft YaHei, sans-serif' font-size="44" font-weight="700" fill="#1F1633">What we can claim now</text>
  </g>
  <g id="purple-titlebar">
    <rect x="0" y="0" width="1190" height="118" fill="#3E1485"/>
    <rect x="1190" y="0" width="90" height="118" fill="#9E89C2"/>
    <text x="64" y="43" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700">CURRENT CLAIMS</text>
    <text x="64" y="84" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">What we can claim now</text>
    <text x="1235" y="70" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">13</text>
  </g>
  <g id="claims">
    <rect x="82" y="190" width="342" height="266" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <use data-icon="tabler-outline/chart-line" x="118" y="228" width="36" height="36" fill="#3E1485" stroke-width="2"/>
    <text x="118" y="306" font-family='Arial, Microsoft YaHei, sans-serif' font-size="25" font-weight="700" fill="#1F1633">Gap diagnosed</text>
    <text x="118" y="360" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#4B405D">
      <tspan x="118" dy="0">The main gap is in decode,</tspan>
      <tspan x="118" dy="30">and it grows with context.</tspan>
    </text>
    <rect x="468" y="190" width="342" height="266" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <use data-icon="tabler-outline/activity" x="504" y="228" width="36" height="36" fill="#9E89C2" stroke-width="2"/>
    <text x="504" y="306" font-family='Arial, Microsoft YaHei, sans-serif' font-size="25" font-weight="700" fill="#1F1633">Cost explained</text>
    <text x="504" y="360" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#4B405D">
      <tspan x="504" dy="0">The profile points to repeated</tspan>
      <tspan x="504" dy="30">model work, not Python loop cost.</tspan>
    </text>
    <rect x="854" y="190" width="342" height="266" rx="8" fill="#FFFFFF" stroke="#D6CBE8"/>
    <use data-icon="tabler-outline/circle-check" x="890" y="228" width="36" height="36" fill="#6B4CA3" stroke-width="2"/>
    <text x="890" y="306" font-family='Arial, Microsoft YaHei, sans-serif' font-size="25" font-weight="700" fill="#1F1633">Baseline credible</text>
    <text x="890" y="360" font-family='Arial, Microsoft YaHei, sans-serif' font-size="18" fill="#4B405D">
      <tspan x="890" dy="0">Self Stage 1 matches the</tspan>
      <tspan x="890" dy="30">reference baseline.</tspan>
    </text>
  </g>
  <g id="not-yet">
    <rect x="246" y="528" width="788" height="70" rx="8" fill="#F4EBDD"/>
    <text x="282" y="558" font-family='Arial, Microsoft YaHei, sans-serif' font-size="15" font-weight="700" fill="#7A4B00">Not claimed yet</text>
    <text x="282" y="584" font-family='Arial, Microsoft YaHei, sans-serif' font-size="19" font-weight="700" fill="#1F1633">A faster custom engine. That requires Stage 2 KV-cache and a new benchmark pass.</text>
  </g>
  <g id="footer">
    <text x="64" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#6F6280">Source: synthesized claims from Phase 0 diagnosis and Phase 1 validation</text>
    <text x="1190" y="675" font-family='Arial, Microsoft YaHei, sans-serif' font-size="11" fill="#6F6280">13 / 16</text>
  </g>
</svg>
