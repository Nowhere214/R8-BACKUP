   <g id="text_1">
    <text style="font-weight: 700; font-size: 25px; font-family: 'Arial'; text-anchor: start; fill: #ffffff" x="37.44" y="48.392812" transform="rotate(-0 37.44 48.392812)">How mlx-lm Generates a Response</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12.5px; font-family: 'Arial'; text-anchor: start; fill: #655875" x="38.88" y="111.951445" transform="rotate(-0 38.88 111.951445)">ORDINARY GREEDY DECODING  /  Schematic overview</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'Arial'; text-anchor: start; fill: #655875" x="38.88" y="492.778125" transform="rotate(-0 38.88 492.778125)">Source: mlx-lm generate.py and models/cache.py. Simplified flow, not a timing result.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Arial'; text-anchor: middle; fill: #1f1633" x="121.68" y="176.2275" transform="rotate(-0 121.68 176.2275)">Prompt</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'Arial'; text-anchor: middle; fill: #655875" x="121.68" y="201.822188" transform="rotate(-0 121.68 201.822188)">Task, old code, feedback</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Arial'; text-anchor: middle; fill: #1f1633" x="330.48" y="176.2275" transform="rotate(-0 330.48 176.2275)">Tokenize</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'Arial'; text-anchor: middle; fill: #655875" x="330.48" y="201.822188" transform="rotate(-0 330.48 201.822188)">Text becomes token IDs</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Arial'; text-anchor: middle; fill: #1f1633" x="550.08" y="176.2275" transform="rotate(-0 550.08 176.2275)">Prefill</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'Arial'; text-anchor: middle; fill: #655875" x="550.08" y="201.895313" transform="rotate(-0 550.08 201.895313)">Process the prompt prefix</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Arial'; text-anchor: middle; fill: #1f1633" x="784.8" y="176.2275" transform="rotate(-0 784.8 176.2275)">Decode step</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'Arial'; text-anchor: middle; fill: #655875" x="784.8" y="201.825" transform="rotate(-0 784.8 201.825)">Model forward + greedy choice</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Arial'; text-anchor: middle; fill: #1f1633" x="550.08" y="320.2275" transform="rotate(-0 550.08 320.2275)">KV cache</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'Arial'; text-anchor: middle; fill: #655875" x="550.08" y="345.825" transform="rotate(-0 550.08 345.825)">Store past keys and values</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: start; fill: #009e73" x="690.48" y="254.843672" transform="rotate(-0 690.48 254.843672)">Update cache</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Arial'; text-anchor: middle; fill: #1f1633" x="784.8" y="343.2675" transform="rotate(-0 784.8 343.2675)">Return response</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'Arial'; text-anchor: middle; fill: #655875" x="784.8" y="368.862188" transform="rotate(-0 784.8 368.862188)">Detokenize output tokens</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12px; font-family: 'Arial'; text-anchor: start; fill: #1f1633" x="858.24" y="278.935313" transform="rotate(-0 858.24 278.935313)">Stop</text>
   </g>
   <g id="text_18">
    <text style="font-size: 12px; font-family: 'Arial'; text-anchor: middle; fill: #655875" x="839.52" y="130.542188" transform="rotate(-0 839.52 130.542188)">Continue</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Arial'; text-anchor: start; fill: #3e1485" x="38.88" y="320.66625" transform="rotate(-0 38.88 320.66625)">The cache saves prefix work.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 17px; font-family: 'Arial'; text-anchor: start; fill: #1f1633" x="38.88" y="354.314766" transform="rotate(-0 38.88 354.314766)">Each new token still needs a model step.</text>
   </g>
   <g id="text_21">
    <text style="font-size: 17px; font-family: 'Arial'; text-anchor: start; fill: #1f1633" x="38.88" y="430.63875" transform="rotate(-0 38.88 430.63875)">Prefill initializes the cache. Decoding extends it as generation continues.</text>
   </g>
